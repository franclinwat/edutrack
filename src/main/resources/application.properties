# ???????????????????????????????????????????????????
# EduTrack ? Configuration
# ???????????????????????????????????????????????????
server.port=8080
spring.application.name=Gestion-scolaire-simplifiee

# ?? MySQL via XAMPP ?????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/edutrack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ?? JPA / Hibernate ?????????????????????????????????
# update = Hibernate lit tes @Entity et crée/adapte les tables
# Il ne supprime jamais les données existantes avec "update"
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ?? Logs ????????????????????????????????????????????
logging.level.com.edutrack=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ?? JWT ??????????????????????????????????????????????????????????????
# Clé secrète ? utilisée pour signer et vérifier les tokens
# En production ? variable d'environnement, jamais en dur dans le code
# Minimum 256 bits (32 caractères) pour HS256
jwt.secret=EduTrackSecretKeyPourJWT2024NdokotiShop12345678

# Durée de validité du token en millisecondes
# 86400000 ms = 24 heures
jwt.expiration=86400000